<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00AA13" />
    <title>Offline — Meridian</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; background: #F8FAFB; color: #1D252D; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
      .card { max-width: 360px; padding: 28px; }
      .m { background: #00AA13; color: #fff; font-weight: bold; letter-spacing: 2px; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #4F758B; font-size: 14px; line-height: 1.6; }
      button { margin-top: 16px; background: #1D252D; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <p><span class="m">MERIDIAN</span></p>
      <h1>You are offline</h1>
      <p>Reconnect to search the catalog and pick up your saved work. Catalog data you have already loaded in this session stays available.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
